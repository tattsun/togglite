name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "Tag v$tag does not match Cargo.toml version $cargo"
            exit 1
          }

      - name: Install toolchain (mise.toml)
        uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Build installer (Inno Setup, preinstalled on windows-latest)
        shell: pwsh
        run: iscc installer\togglite.iss

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $setup = "dist/Togglite-Setup-$ver.exe"
          if (-not (Test-Path $setup)) { Write-Error "installer $setup not found"; exit 1 }
          $name = "togglite-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/togglite.exe, README.md, LICENSE dist/$name/
          Compress-Archive -Path dist/$name -DestinationPath dist/$name.zip
          Copy-Item target/release/togglite.exe dist/togglite.exe
          Get-FileHash $setup, dist/$name.zip, dist/togglite.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Togglite-Setup-*.exe
            dist/togglite-${{ github.ref_name }}-windows-x64.zip
            dist/togglite.exe
            dist/SHA256SUMS.txt
